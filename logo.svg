<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="GM">
  <circle cx="100" cy="100" r="98" fill="#1e2430"/>
  <circle cx="100" cy="100" r="93" fill="none" stroke="#d7dde8" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="54" fill="none" stroke="#d7dde8" stroke-width="1.2"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="24s" repeatCount="indefinite"/>
