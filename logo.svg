    </text>
    <text fill="#f7f9fc" font-family="Sora, sans-serif" font-size="13" font-weight="700" letter-spacing="3.5">
      <textPath href="#logoBot" startOffset="50%" text-anchor="middle">FRONTEND</textPath>
